<!DOCTYPE html>
<html>
    <head>
        <title>Image HTML dan CSS</title>
          <link rel="stylesheet" href="image.css">
    </head>
    <body>
        <!-- Cara menambahkan Gambar, format gambar : .jpg/.jpeg/.png/.gif  -->
         <p>Ini adalah Gambar dengan ukuran normal</p>
         <img src="Yushi 2.jpg" alt="Yushi">

         <!-- Cara Merubah ukuran Gambar -->
          <p>Ini adalah gambar yang sudah di ganti ukuran</p>
          <img src="Yushi 2.jpg" alt="Yushi" class="ukuran"> 

          <!-- Cara menambahkan lengkungan pada gambar -->
           <p>Ini adalah gambar yang sudah diberi lengkungan</p>
           <img src="Yushi 2.jpg" alt="Yushi" class="lengkungan">

           <!-- Cara menggabungkan gambar dan teks -->
            <div class="kelompok">
                <img src="Yushi 2.jpg" alt="Yushi NCT Wish">
                <p>Gambar Yushi NCT Wish</p>

            </div>

             <!-- Cara memberikan efek hover -->
            <div class="efek">
                <img src="Yushi 2.jpg" alt="Yushi NCT Wish">
                <p><font size="6"><b>Ini Contoh Hover</b></font></p>
                </div>

                <!-- Ini font Internal -->
                 <p class="internal"> <font size="5"> Ini Contoh Font Internal</p>

                 <!-- Ini font External -->
                 <p class="external"> <font size="6"> Ini Contoh Font External</p>
                
    </body>
</html>
